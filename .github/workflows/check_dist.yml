name: Check dist

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - name: Fail if dist is outdated
        run: |
          if [ -n "$(git diff --name-only dist/)" ]; then
            echo "dist/ is outdated. Run 'npm run build' and commit the result."
            git diff dist/
            exit 1
          fi
